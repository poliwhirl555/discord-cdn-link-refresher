[project]
name = "discord-cdn-link-refresher"
version = "1.0.2"
description = "A simple CLI program and Python Library for refreshing expired Discord CDN media links."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nuitka>=4.3.1",
    "pyperclip>=1.11.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["disc_link_refresher.py"]

[project.scripts]
dclr = "disc_link_refresher:main"

[project.urls]
Homepage = "https://pypi.org/project/discord-cdn-link-refresher/"
Repository = "https://github.com/poliwhirl555/discord-cdn-link-refresher"
Issues = "https://github.com/poliwhirl555/discord-cdn-link-refresher/issues"
